<main class="catalog category-page">
  <nav class="breadcrumbs"><a href="/">Home</a><span>/</span><a href="/shop">Shop</a><span>/</span><strong>{{category}}</strong></nav>
  <section class="category-intro">
    <p class="eyebrow">THE COLLECTION</p>
    <h1>{{category}}</h1>
    <p class="hero-text">{{description}}</p>
    <span class="catalog-count">{{count}} pieces</span>
  </section>
  <div class="section-head category-controls">
    <div class="pills">{{pills}}</div>
    <form class="search"><input name="q" value="{{query}}" placeholder="Search this collection"><button>Search</button></form>
  </div>
  <div class="product-grid">{{products}}</div>
</main>
