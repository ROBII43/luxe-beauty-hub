<main class="auth-page">
  <section class="auth-visual">
    <p class="eyebrow">WELCOME TO {{shop_name}}</p>
    <h1>Good things<br><em>await.</em></h1>
    <p>Save your favourites, follow every order, and make checkout feel effortless.</p>
    <div class="auth-visual-mark">L</div>
  </section>
  <section class="auth-card">
    <div class="auth-card-heading"><span class="auth-icon">↗</span><div><p class="eyebrow">YOUR ACCOUNT</p><h2>Sign in</h2></div></div>
    {{error}}
    <form method="post" class="auth-form">
      <input type="hidden" name="action" value="login">
      <div class="field"><label for="login-email">Email address</label><input id="login-email" name="email" type="text" inputmode="email" autocomplete="email" placeholder="you@example.com" required></div>
      <div class="field"><label for="login-password">Password</label><input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required></div>
      <div class="auth-options"><label class="check"><input type="checkbox"> Remember me</label><a href="/forgot-password">Forgot password?</a></div>
      <button class="primary auth-submit">Sign in <span>↗</span></button>
    </form>
    <p class="auth-switch">New to {{shop_name}}? <a href="/register">Create an account</a></p>
    <p class="auth-security">Your information is protected with secure encrypted authentication.</p>
  </section>
</main>
