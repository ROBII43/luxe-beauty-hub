<main class="auth-page">
  <section class="auth-visual register-visual">
    <p class="eyebrow">THE LUXE CIRCLE</p>
    <h1>Make it<br><em>personal.</em></h1>
    <p>Build your own edit of beauty, home and everyday pleasures.</p>
    <div class="auth-benefits"><span>01</span> Order tracking<br><span>02</span> Saved wishlist<br><span>03</span> Faster checkout</div>
  </section>
  <section class="auth-card">
    <div class="auth-card-heading"><span class="auth-icon">+</span><div><p class="eyebrow">JOIN THE EDIT</p><h2>Create account</h2></div></div>
    {{error}}
    <form method="post" class="auth-form">
      <input type="hidden" name="action" value="register">
      <div class="field"><label for="register-name">Full name</label><input id="register-name" name="name" autocomplete="name" placeholder="Your name" required></div>
      <div class="field"><label for="register-email">Email address</label><input id="register-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div>
      <div class="field"><label for="register-phone">Phone number</label><input id="register-phone" name="phone" type="tel" autocomplete="tel" placeholder="+254 700 000 000" required></div>
      <div class="field"><label for="register-password">Password</label><input id="register-password" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" minlength="8" required></div>
      <label class="check terms"><input type="checkbox" required> I agree to the terms and privacy policy</label>
      <button class="primary auth-submit">Create account <span>↗</span></button>
    </form>
    <p class="auth-switch">Already have an account? <a href="/login">Sign in</a></p>
    <p class="auth-security">Passwords are protected with salted secure hashing.</p>
  </section>
</main>
